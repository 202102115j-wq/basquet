name: Verificación Laravel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar aplicación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, ctype, fileinfo, openssl, pdo_sqlite, sqlite3, tokenizer, xml, dom, xmlwriter
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Verificar sintaxis PHP
        run: |
          find app bootstrap config database public routes -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Ejecutar migraciones
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Verificar rutas de Laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan route:list --except-vendor
